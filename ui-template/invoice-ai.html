<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت فاکتور با AI — رایو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap">
<link rel="stylesheet" href="../newpanel/core/css/theme.css">
<style>
.ia-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.ia-steps>div{border:1px solid var(--border);border-radius:var(--radius);padding:var(--s3);background:var(--surface);font-size:13px;color:var(--text-2)}
.ia-steps>div.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.ia-steps b{display:block;font-size:14px;color:var(--text)}
.ia-photo{aspect-ratio:3/4;border:2px dashed var(--border-strong);border-radius:var(--radius);display:grid;place-items:center;background:var(--surface-2);overflow:hidden;color:var(--text-3);text-align:center;padding:var(--s4)}
.ia-photo img{width:100%;height:100%;object-fit:contain}
.ia-low{background:var(--warning-soft)!important}
.ia-bad{background:var(--danger-soft)!important}
.ia-conf{font-size:11px;color:var(--text-3)}
.ia-code{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--surface-3);border-radius:var(--radius);padding:var(--s4);overflow:auto;white-space:pre;max-height:420px}
.neg{color:var(--danger)}.pos{color:var(--success)}.mut{color:var(--text-3)}
.table input.input{min-width:70px;padding:6px 8px}
@media (max-width:900px){.ia-steps{grid-template-columns:1fr 1fr}}
</style>
<script>try{var t=localStorage.getItem('rt_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <div class="crumbs"><span>خرید و تأمین</span><i data-lucide="chevron-left" style="width:14px;height:14px"></i><span>فاکتور خرید</span></div>
          <h1>ثبت فاکتور خرید با عکس و AI</h1>
          <p>عکس فاکتور با گوشی ← استخراج خودکار ← بازبینی و تأیید مدیر ← فاکتور نهایی. <b>نمونهٔ طراحی؛ استخراج شبیه‌سازی می‌شود.</b></p>
        </div>
      </div>
      <div class="tabs" data-tabs="ia" id="iaTabs">
        <button class="tab active" data-tab="new"><i data-lucide="camera"></i>فاکتور جدید</button>
        <button class="tab" data-tab="queue"><i data-lucide="inbox"></i>صف تأیید مدیر <span class="badge badge-warning plain">۳</span></button>
        <button class="tab" data-tab="design"><i data-lucide="workflow"></i>طرح فنی</button>
      </div>
      <section data-panel="ia:new"></section>
      <section data-panel="ia:queue" hidden></section>
      <section data-panel="ia:design" hidden></section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../newpanel/core/js/app.js"></script>
<script src="../newpanel/core/js/invoice-ai.js"></script>
</body>
</html>
